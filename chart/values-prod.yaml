# Production overrides — combine with values-google.yaml or values-remote.yaml.
# Example:
#   helm upgrade --install google-analytics-mcp ./chart \
#     -f values-google.yaml -f values-prod.yaml

# Enable TLS certificate provisioning via cert-manager
certificate:
  enabled: true
  issuerRef:
    name: cloudflare
    kind: ClusterIssuer

# Enable Traefik IngressRoute
ingressRoute:
  enabled: true
  entryPoints:
    - websecure
  priority: 10

secret:
  create: false  # Manage the Secret externally

image:
  pullPolicy: Always
