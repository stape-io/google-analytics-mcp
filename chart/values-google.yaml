# Example values for Google OAuth provider deployment
host: "your-domain.com"

# Base URL of the MCP server visible to OAuth clients.
# Defaults to https://<host> if not set.
baseUrl: "https://your-domain.com"

image:
  repository: "ghcr.io/stape-io/google-ads-mcp"
  tag: "latest"
  pullPolicy: Always

auth:
  provider: "google"

  google:
    requireAuthorizationConsent: "external"
    # Extra parameters forwarded to the authorization endpoint
    extraAuthorizeParams:
      access_type: offline
    # Set to true to load the signing key from the Secret
    jwtSigningKeyEnabled: true

    storage:
      enabled: true
      # Use "redis" for multi-replica deployments; "in-memory" for single-replica
      type: "redis"
      # Set to true to load the encryption key from the Secret (strongly recommended)
      encryptionKeyEnabled: true

secret:
  create: true
  data:
    developerToken: "your-developer-token"
    googleOauthClientId: "your-client-id.apps.googleusercontent.com"
    googleOauthClientSecret: "your-client-secret"
    googleOauthJwtSigningKey: "your-jwt-signing-key"
    authStorageRedisUrl: "redis://redis-service:6379/0"
    authStorageEncryptionKey: "your-fernet-key-here"

resources:
  requests:
    memory: "256Mi"
    cpu: "100m"
  limits:
    memory: "512Mi"
