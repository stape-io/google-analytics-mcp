image:
  repository: ghcr.io/stape-io/google-analytics-mcp
  pullPolicy: IfNotPresent
  tag: ""

resources:
  requests:
    cpu: 10m
    memory: 200Mi

autoscaling:
  enabled: false

# Items named in full: a rename in 1Password then fails loudly instead of
# yielding a Secret with no fields. See templates/onepassword-items.yaml.
onePasswordSecrets:
  vault: 'google-analytics-mcp-dev'
  manualItem: 'google-analytics-mcp_dev-manual'

host: "example.com"
