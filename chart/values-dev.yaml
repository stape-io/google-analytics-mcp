  tag: 89df388-43046110952-1

# VerticalPodAutoscaler, iris 7d peak on dev (OPS-2603): 3m / 157Mi against a 10m / 200Mi request.
# minMemory is half the request, rounded down; there are no limits, so maxCpu and maxMemory stand in
# for them (memory: twice the 7d peak, rounded up).
vpa:
  enabled: true
  main:
    minMemory: 64Mi
    maxCpu: 500m
    maxMemory: 512Mi
