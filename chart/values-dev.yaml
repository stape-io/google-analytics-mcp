# VerticalPodAutoscaler, iris 7d peak on dev (OPS-2603): 3m / 157Mi against a 10m / 200Mi request.
# minMemory is half the request; there are no limits, so maxCpu and maxMemory stand in for them
# (memory: twice the 7d peak).
vpa:
  enabled: true
  main:
    minMemory: 100Mi
    maxCpu: 500m
    maxMemory: 313Mi
