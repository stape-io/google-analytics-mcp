{{- if .Values.certificate.enabled }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "google-ads-mcp.fullname" . }}
  labels:
    {{- include "google-ads-mcp.labels" . | nindent 4 }}
spec:
  commonName: {{ .Values.host | quote }}
  secretName: {{ include "google-ads-mcp.fullname" . }}-certificate
  dnsNames:
    - {{ .Values.host | quote }}
  issuerRef:
    name: {{ .Values.certificate.issuerRef.name }}
    kind: {{ .Values.certificate.issuerRef.kind }}
{{- end }}
