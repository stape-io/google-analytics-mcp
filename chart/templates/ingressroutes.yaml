{{- if .Values.ingressRoute.enabled }}
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ include "google-ads-mcp.fullname" . }}
  labels:
    {{- include "google-ads-mcp.labels" . | nindent 4 }}
  {{- with .Values.ingressRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  entryPoints:
    {{- toYaml .Values.ingressRoute.entryPoints | nindent 4 }}
  routes:
    - kind: Rule
      match: Host(`{{ .Values.host }}`)
      priority: {{ .Values.ingressRoute.priority | default 10 }}
      services:
        - name: {{ include "google-ads-mcp.fullname" . }}
          namespace: {{ .Release.Namespace }}
          port: {{ .Values.ingressRoute.servicePort | default .Values.service.port }}
  tls:
    secretName: {{ include "google-ads-mcp.fullname" . }}-certificate
{{- end }}
