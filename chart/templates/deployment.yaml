apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "google-analytics-mcp.fullname" . }}
  labels:
    {{- include "google-analytics-mcp.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: 1
  {{- end }}
  selector:
    matchLabels:
      {{- include "google-analytics-mcp.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "google-analytics-mcp.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "google-analytics-mcp.fullname" . }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            # MCP server settings
            - name: GOOGLE_ANALYTICS_MCP_BASE_URL
              value: {{ printf "https://%s" .Values.host | quote }}
            - name: GOOGLE_ANALYTICS_MCP_AUTH_PROVIDER
              value: "google"
            - name: GOOGLE_ANALYTICS_MCP_OAUTH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "google-analytics-mcp.fullname" . }}
                  key: GOOGLE_ANALYTICS_MCP_OAUTH_CLIENT_ID
            - name: GOOGLE_ANALYTICS_MCP_OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "google-analytics-mcp.fullname" . }}
                  key: GOOGLE_ANALYTICS_MCP_OAUTH_CLIENT_SECRET
            - name: GOOGLE_ANALYTICS_MCP_OAUTH_REQUIRE_AUTHORIZATION_CONSENT
              value: "external"
            - name: GOOGLE_ANALYTICS_MCP_OAUTH_EXTRA_AUTHORIZE_PARAMS
              value: "{\"access_type\":\"offline\"}"
            - name: GOOGLE_ANALYTICS_MCP_OAUTH_JWT_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "google-analytics-mcp.fullname" . }}
                  key: GOOGLE_ANALYTICS_MCP_OAUTH_JWT_SIGNING_KEY
            # Auth storage
            - name: GOOGLE_ANALYTICS_MCP_AUTH_STORAGE_TYPE
              value: "redis"
            - name: GOOGLE_ANALYTICS_MCP_AUTH_STORAGE_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "google-analytics-mcp.fullname" . }}
                  key: GOOGLE_ANALYTICS_MCP_AUTH_STORAGE_REDIS_URL
            - name: GOOGLE_ANALYTICS_MCP_AUTH_STORAGE_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "google-analytics-mcp.fullname" . }}
                  key: GOOGLE_ANALYTICS_MCP_AUTH_STORAGE_ENCRYPTION_KEY
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- else }}
          resources: {}
          {{- end }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "google-analytics-mcp.selectorLabels" . | nindent 14 }}
