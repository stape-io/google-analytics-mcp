name: Deploy to Non-production

run-name: Deploy to 'dev'

on:
  workflow_dispatch:

env:
  NAME: mcp-ga
  REGISTRY: europe-west1-docker.pkg.dev
  REPOSITORY: stape-development/stape
  IMAGE: mcp-ga

jobs:
  generate-image-tag:
    name: Generate Docker Image Tag
    uses: ./.github/workflows/generate-tag.yaml

  build-and-push-image:
    name: Build Docker Image and Push to GAR
    needs: generate-image-tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/664050025753/locations/global/workloadIdentityPools/github/providers/stape-io
          service_account: github-actions@stape-development.iam.gserviceaccount.com
          token_format: access_token

      - name: Login to GAR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:${{ needs.generate-image-tag.outputs.image_tag }}

  deploy-to-kubernetes:
    name: Deploy to dev
    needs:
      - generate-image-tag
      - build-and-push-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/664050025753/locations/global/workloadIdentityPools/github/providers/stape-io
          service_account: github-actions@stape-development.iam.gserviceaccount.com

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          project_id: stape-development
          cluster_name: ${{ secrets.GKE_CLUSTER_DEV }}
          location: ${{ secrets.GKE_LOCATION_DEV }}

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Update chart image tag
        run: |
          sed -i "s/tag: .*/tag: \"${{ needs.generate-image-tag.outputs.image_tag }}\"/" chart/values-dev.yaml

      - name: Deploy Helm Chart
        run: |
          helm upgrade --install "${NAME}-dev" chart/ \
            --namespace "${NAME}-dev" \
            --create-namespace \
            --values chart/values-dev.yaml \
            --wait \
            --timeout 10m
