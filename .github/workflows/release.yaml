name: Release to Production

run-name: Deploy to 'prod'

on:
  workflow_dispatch:

env:
  GCP_PROJECT_ID: stape-production
  GCP_PROJECT_NUMBER: 207001532273
  REGISTRY: europe-west1-docker.pkg.dev
  REPOSITORY: stape-production/stape/google-analytics-mcp

jobs:
  generate-image-tag:
    name: Generate Docker Image Tag
    uses: ./.github/workflows/generate-tag.yaml

  build-and-push-image:
    name: Build Docker Image and Push to GAR
    needs: generate-image-tag
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/${{ env.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github/providers/stape-io
          service_account: github-actions@${{ env.GCP_PROJECT_ID }}.iam.gserviceaccount.com
          token_format: access_token

      - name: Login to GAR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.REPOSITORY }}:${{ needs.generate-image-tag.outputs.image_tag }}

  update-image-tag:
    name: Update Image Tag
    needs:
      - generate-image-tag
      - build-and-push-image
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Update Image Tag in values-prod.yaml
        uses: fjogeleit/yaml-update-action@v0.17.0
        with:
          branch: main
          changes: |
            {
              "chart/values-prod.yaml": {
                "image.tag": "${{ needs.generate-image-tag.outputs.image_tag }}"
              }
            }
          message: Updated image.tag in values-prod.yaml
          quotingType: '"'
          token: ${{ github.token }}
