name: Release to Production

run-name: Deploy to 'prod'

on:
  workflow_dispatch:

env:
  GCP_PROJECT_ID: stape-production
  GCP_PROJECT_NUMBER: 207001532273
  REGISTRY: europe-west1-docker.pkg.dev
  REPOSITORY: stape-production/stape/mcp-ga

jobs:
  generate-image-tag:
    name: Generate Docker Image Tag
    uses: ./.github/workflows/generate-tag.yaml

  build-and-push-image:
    name: Build Docker Image and Push to GAR
    needs: generate-image-tag
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/${{ env.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github/providers/stape-io
          service_account: github-actions@${{ env.GCP_PROJECT_ID }}.iam.gserviceaccount.com
          token_format: access_token

      - name: Login to GAR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.REPOSITORY }}:${{ needs.generate-image-tag.outputs.image_tag }}

  update-k8s-secret:
    name: Update Kubernetes Secret
    needs:
      - build-and-push-image
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/${{ env.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github/providers/stape-io
          service_account: github-actions@${{ env.GCP_PROJECT_ID }}.iam.gserviceaccount.com

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          cluster_name: ${{ secrets.GKE_CLUSTER }}
          location: ${{ secrets.GKE_LOCATION }}

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Install 1Password CLI
        uses: 1password/install-cli-action@v1

      - name: Update Kubernetes Secret
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        run: |
          item_json=$(op item get env.prod --vault google-analytics-mcp --format json)

          printf '%s' "$item_json" | jq -r '
            [ .fields[]? | select(.label != "notesPlain" and .value != null and .value != "") | "\(.label)=\(.value)" ] as $pairs
            | if ($pairs | length) > 0 then
                $pairs[]
              else
                (.fields[]? | select(.label == "notesPlain") | .value // empty)
              end
          ' > .env.local

          test -s .env.local

          kubectl create namespace mcp-ga --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret generic mcp-ga \
            --namespace mcp-ga \
            --dry-run=client \
            --from-env-file=.env.local \
            -o yaml | kubectl apply -f -

  update-image-tag:
    name: Update Image Tag
    needs:
      - generate-image-tag
      - update-k8s-secret
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Update Image Tag in values-prod.yaml
        uses: fjogeleit/yaml-update-action@v0.17.0
        with:
          branch: OPS-2183 # TODO: switch to main
          changes: |
            {
              "chart/values-prod.yaml": {
                "image.tag": "${{ needs.generate-image-tag.outputs.image_tag }}"
              }
            }
          message: Updated image.tag in values-prod.yaml
          quotingType: '"'
          token: ${{ github.token }}
