# Runs tests on pull requests for main
permissions: read-all
name: Presubmit
on:
  pull_request:
    branches:
      - main
jobs:
  test:
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install nox and uv
      run: pip install -e .[dev] uv

    - name: Check formatting
      run: nox -s lint
    - name: Run tests
      run: nox -s tests-${{ matrix.python-version }}
    - name: Run wire smoke tests
      # Goldens are version-independent; running them on every matrix leg
      # buys nothing. Run from uv.lock: they are byte-exact, so unpinned
      # dependency resolution would make them drift on unrelated PRs.
      if: matrix.python-version == '3.13'
      run: uv run --frozen python -m unittest tests/smoke/smoke_test.py
