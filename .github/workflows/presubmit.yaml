# Runs tests on pull requests for main
permissions: read-all
name: Presubmit
on:
  pull_request:
    branches:
      - main
jobs:
  test:
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install nox and uv
      run: pip install -e .[dev]

    - name: Check formatting
      run: nox -s lint
    - name: Run ruff
      # ruff/mypy findings and the wire goldens don't depend on which
      # interpreter runs them; gated to 3.14 (the Dockerfile's version) so
      # they run once, on the version actually shipped.
      if: matrix.python-version == '3.14'
      run: ruff check .
    - name: Run mypy
      if: matrix.python-version == '3.14'
      run: mypy
    - name: Run tests
      run: nox -s tests-${{ matrix.python-version }}
    - name: Run wire smoke tests
      if: matrix.python-version == '3.14'
      run: python -m unittest tests/smoke/smoke_test.py
